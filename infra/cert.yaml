# TLS for the CTF platform (ctf-nm.org) via cert-manager DNS-01 using the
# existing letsencrypt-prod ClusterIssuer + Cloudflare token. The Cloudflare
# token (secret cloudflare-api-token in cert-manager ns) must have Zone:DNS:Edit
# on the ctf-nm.org zone. Apex + wildcard so subdomains are covered too.
# The app's Ingress references secretName: ctf-tls.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ctf-tls
  namespace: ctf
spec:
  secretName: ctf-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "ctf-nm.org"
    - "*.ctf-nm.org"
