# Syncs the CTF secrets from Vault (secret/ctf/app) into a native k8s Secret
# named `ctf-secrets`. Datastores and the app consume it via secretKeyRef/envFrom.
# Kubelet blocks any pod that references this Secret until ESO has created it,
# which orders secret delivery before Postgres/Redis/backend start.
#
# Populate Vault first (see README): vault kv put secret/ctf/app <keys...>.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ctf-secrets
  namespace: ctf
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ctf-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ctf/app
