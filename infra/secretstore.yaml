# ESO SecretStore for the ctf namespace: how External Secrets reaches Vault.
# Uses Kubernetes auth — ESO presents the `external-secrets-sa` token and Vault
# maps it (via the "ctf" role) to the ctf-read policy. Mirrors the platform's
# per-namespace vault-backend pattern.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: ctf
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ctf"
          serviceAccountRef:
            name: "external-secrets-sa"
