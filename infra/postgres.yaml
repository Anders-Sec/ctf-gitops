# Dedicated PostgreSQL for the CTF platform — the source of truth. Password comes
# from the ESO-synced `ctf-secrets` (key: postgres-password). Data on a retained PVC.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ctf
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ctf
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: ctf
            - name: POSTGRES_DB
              value: ctf
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ctf-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ctf", "-d", "ctf"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
