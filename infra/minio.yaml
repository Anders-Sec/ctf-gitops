# S3-compatible object storage for challenge artifacts (handout files). Chosen
# over an RWO PVC on the backend so uploads are visible to every backend replica.
# Root creds come from ctf-secrets (minio-access-key / minio-secret-key); the app
# uses the same as S3_ACCESS_KEY / S3_SECRET_KEY. Bucket `ctf-artifacts` is created
# by the PostSync hook below.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: ctf
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: ctf
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC — never two pods attached at once
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest   # TODO: pin a RELEASE.* tag before the event
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: minio-access-key } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: minio-secret-key } }
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: ctf
spec:
  selector:
    app: minio
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# Idempotently create the ctf-artifacts bucket after each sync (mc mb is a no-op
# if it already exists). Runs as an ArgoCD PostSync hook.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-createbucket
  namespace: ctf
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: AK
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: minio-access-key } }
            - name: SK
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: minio-secret-key } }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for i in $(seq 1 30); do
                if mc alias set local http://minio.ctf.svc.cluster.local:9000 "$AK" "$SK" 2>/dev/null; then break; fi
                echo "waiting for minio..."; sleep 3
              done
              mc mb --ignore-existing local/ctf-artifacts
              echo "bucket ctf-artifacts ready"
