# Redis for the CTF platform: scoreboard cache, pub/sub for live updates, and
# rate limiting. Postgres remains the source of truth, but the rate limiter fails
# CLOSED, so a Redis restart takes flag submission offline until it returns. To
# shrink that window on this single node, Redis is persistent (AOF on a PVC) so it
# recovers its state on restart instead of coming back empty.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: ctf
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ctf
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ctf
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC — never two pods attached at once
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ctf-secrets
                  key: redis-password
          ports:
            - containerPort: 6379
          # Sized for the event kickoff, not steady state. Redis is
          # SINGLE-THREADED, so a 250m limit meant it throttled at a quarter of
          # one core while the node's other 39 sat idle — and the moment that
          # matters is everyone authenticating, hitting the rate limiter and
          # loading the scoreboard inside the same minute. Connection count was
          # never the constraint (maxclients 10000, ~9 in use).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
