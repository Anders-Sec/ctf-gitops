# ArgoCD Application for the CTF app itself. Source of truth for the app's
# manifests is the app repo's deploy/ directory (plain manifests: backend,
# frontend, ingress). Platform-owned datastores/secrets/cert live in this repo's
# infra/ (see infra-app.yaml). Apply once into the existing ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ctf
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Anders-Sec/ctf.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: ctf
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
