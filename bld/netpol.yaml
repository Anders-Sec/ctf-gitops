# Pod-reachability isolation for bld (item 6a). Defence in depth for the POD, and
# explicitly NOT a client-IP gate: once traffic passes through ingress-nginx, a
# pod-level ipBlock only ever sees the controller, never the real client. Client
# restriction is impossible here for that reason — see bld/namespace.yaml.
#
# Applied to ctf-bld FIRST, before the equivalent pair for the live `ctf`
# namespace (6b), so the rule set is proven on an empty namespace where a mistake
# costs nothing. In prod the same mistake would be re-applied continuously by
# ArgoCD selfHeal, which turns an outage self-sustaining.
#
# NetworkPolicies are additive, so the allow-rules below union on top of the
# default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ctf-bld-default-deny-all
  namespace: ctf-bld
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The ingress controller is the only permitted source of inbound traffic, and only
# on the app's own ports. Ports are the POD ports: ctf-frontend's Service is :80
# but its container listens on :8080, and NetworkPolicy matches the pod port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ctf-bld-allow-ingress-from-controller
  namespace: ctf-bld
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [ctf-backend, ctf-frontend]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8000 }   # ctf-backend container port
        - { protocol: TCP, port: 8080 }   # ctf-frontend container port
---
# Datastores accept connections from the backend only. Needed explicitly: the
# default-deny above isolates Postgres and Redis too, so without this the backend
# cannot reach them even though both sit in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ctf-bld-allow-datastore-ingress
  namespace: ctf-bld
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [postgres, redis]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ctf-backend
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
---
# Backend egress. Deliberately narrower than prod's will be:
#   - no ctf-instances egress — instances are OFF for bld, so there is nothing
#     there to manage and no namespace to reach.
#   - AI/image generation *is* allowed, see below. Omitted originally on the
#     assumption bld would start with it unconfigured — but ai_configured only
#     requires ai_enabled + ai_base_url + ai_model (not an API key), and
#     deploy/bld sets all three, so bld considered AI live from day one and the
#     calls failed CLOSED against this policy.
#   - SMTP *is* allowed, see below. It was omitted originally because bld started
#     with mail unconfigured; once SMTP credentials were added to ctf-bld-secrets
#     the sends failed CLOSED with SMTPConnectError until this rule existed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ctf-bld-allow-backend-egress
  namespace: ctf-bld
spec:
  podSelector:
    matchLabels:
      app: ctf-backend
  policyTypes: [Egress]
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Own datastores
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [postgres, redis]
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
    # Kubernetes API. Both forms are allowed on purpose: policy enforcement here is
    # iptables-based and evaluates egress after service DNAT, so the ClusterIP form
    # alone is not reliably sufficient — 10.43.0.1:443 DNATs to the node's
    # apiserver on :6443.
    - to:
        - ipBlock: { cidr: 10.43.0.1/32 }
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock: { cidr: 10.0.0.234/32 }
      ports:
        - { protocol: TCP, port: 6443 }
    # AI model + image generation.
    #
    # An explicit ipBlock, not a selector: the `ai` Service is SELECTORLESS with
    # manually-managed Endpoints pointing at 10.0.0.151, an off-cluster host on
    # the LAN. No podSelector or namespaceSelector can ever match it, and traffic
    # to the Service ClusterIP is DNAT'd to this address before egress is
    # evaluated.
    #
    # Port 8000, not 1235: the model provider was changed from LM Studio to vLLM
    # on the same host. The Service port stays 1235 so the app's AI_BASE_URL is
    # unchanged -- the move is absorbed in the Endpoints object, which is the
    # whole point of putting an off-cluster host behind a Service. bld deliberately shares prod's single on-LAN model host, which
    # is why AI_BASE_URL in deploy/bld points at ai.ctf.svc — the Service object
    # is only a DNS/DNAT indirection, so allowing the endpoint address covers it
    # regardless of which namespace's Service is used to reach it.
    - to:
        - ipBlock: { cidr: 10.0.0.151/32 }
      ports:
        - { protocol: TCP, port: 8000 }   # model API (vLLM; was LM Studio on 1235)
        - { protocol: TCP, port: 8188 }   # image generation (ComfyUI)
    # SMTP (mail relay for passwordless magic-link login).
    #
    # Port-scoped rather than address-scoped on purpose: the relay
    # (smtp.protonmail.ch) resolved to three different addresses when this was
    # written and providers rotate them, so pinning ipBlocks would break mail
    # silently the next time they change. Allowing one TCP port outbound is the
    # stable form, and still far tighter than prod, whose namespace has no
    # NetworkPolicy at all.
    #
    # 10.0.0.0/8 is excluded so this cannot become a general route into the pod
    # CIDR (10.42/16), the service CIDR (10.43/16) or the LAN (10.0.0.0/24) on
    # this port. If an internal relay is ever used instead, that exclusion is
    # what will need revisiting.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
      ports:
        - { protocol: TCP, port: 587 }
---
# Frontend serves static assets and needs nothing but name resolution. It does not
# talk to the backend: the ingress routes /api straight to ctf-backend rather than
# proxying through the frontend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ctf-bld-allow-frontend-egress
  namespace: ctf-bld
spec:
  podSelector:
    matchLabels:
      app: ctf-frontend
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
