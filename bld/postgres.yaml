# Postgres for bld — same shape as prod's (infra/postgres.yaml) so a promotion
# rehearsal exercises the real thing, on a smaller PVC since bld holds rehearsal
# data rather than the event's source of truth. Credentials come from
# `ctf-bld-secrets`, which is created out-of-band with FRESH values: bld must never
# share prod's datastore passwords.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ctf-bld
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ctf-bld
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: ctf
            - name: POSTGRES_DB
              value: ctf
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ctf-bld-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ctf", "-d", "ctf"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: "1", memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
