# ArgoCD Application for the one-time ctf-instances platform setup (namespace,
# quota/limits, RBAC for the backend SA, standing default-deny, wildcard cert).
# The instance objects themselves are created by the app at runtime, not here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ctf-instances
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Anders-Sec/ctf-gitops.git
    targetRevision: main
    path: instances
  destination:
    server: https://kubernetes.default.svc
    namespace: ctf-instances
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
