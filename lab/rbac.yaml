# Lets the app's backend manage sandbox pods in ctf-lab and open a PTY into
# them. Mirrors the ctf-instances pattern: a Role scoped to THIS namespace,
# bound to the ctf-backend ServiceAccount which lives in ns ctf. A
# RoleBinding's subject may come from any namespace; the Role's verbs apply
# only within ctf-lab, so this grants nothing outside it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-lab-manager
  namespace: ctf-lab
rules:
  # list/watch included on the event owner's instruction (2026-10-25). The
  # request originally asked for create/get/delete only, but the lab reuses the
  # spec 008/009 reconciler and TTL machinery, which enumerates pods to find
  # expired ones. Without list, reaping would fail silently and pods would
  # accumulate until the 15-pod quota blocked new launches mid-event.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # The PTY. BOTH verbs are required, and which one applies depends on the
  # transport the client uses:
  #
  #   SPDY exec      (what `kubectl exec` does)       POST -> verb `create`
  #   WebSocket exec (what kubernetes_asyncio does     GET -> verb `get`
  #                   over aiohttp, a GET + Upgrade)
  #
  # The original request asked for `create` only, which is right for SPDY, and
  # that is what shipped. The backend uses the WebSocket transport, so every lab
  # shell died on the handshake:
  #
  #   aiohttp WSServerHandshakeError: 403 'Invalid response status'
  #   url='wss://10.43.0.1/api/v1/namespaces/ctf-lab/pods/<name>/exec'
  #
  # That was invisible to the obvious check. A SubjectAccessReview for `create`
  # returns allowed; only one for `get` returns denied. Reviewing the verb in the
  # Role rather than the verb the client sends confirms what you built instead of
  # what the code needs.
  #
  # `get` is NOT a wider privilege than `create` here: both grant arbitrary
  # command execution in these pods. Same capability, other transport.
  #
  # This remains the backend's only exec grant anywhere in the cluster, and it
  # reaches only gVisor-contained, network-less sandbox pods in this namespace.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # DELIBERATELY ABSENT: services. The app side confirmed on 2026-10-25 that the
  # lab is exec-only — no Service, no Ingress, no subdomain — and the launcher
  # branches to skip them here. Granted briefly while that was only "likely
  # unused", then trimmed. If a launcher-driven launch ever 403s on services,
  # this is the line to restore.
  #
  # DELIBERATELY ABSENT: networkpolicies. The event owner confirmed the backend
  # does not need it (2026-10-25). The deny-all in lab/netpol.yaml is
  # namespace-wide and platform-owned, and withholding `create` here means an
  # app-side bug cannot add an allow-rule that undoes the containment this
  # whole design rests on.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-lab-manager
  namespace: ctf-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ctf-lab-manager
subjects:
  - kind: ServiceAccount
    name: ctf-backend
    namespace: ctf
