# Namespaced permissions for the backend's SA to manage instance objects in
# ctf-instances ONLY. No cluster-scoped rights; deliberately no secrets/configmaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctf-instance-manager
  namespace: ctf-instances
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch, create, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctf-instance-manager
  namespace: ctf-instances
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ctf-instance-manager
subjects:
  - kind: ServiceAccount
    name: ctf-backend
    namespace: ctf
