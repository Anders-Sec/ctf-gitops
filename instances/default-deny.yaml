# The load-bearing isolation object: selects EVERY pod in ctf-instances and allows
# nothing (no ingress, no egress). A pod is isolated the instant it exists, before
# the app's per-instance policy layers on DNS egress + ingress-from-controller.
# Platform-owned here (declarative + ArgoCD self-heal) so isolation never depends on
# app startup logic. NetworkPolicies are additive, so the app's per-instance allows
# union cleanly on top of this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ctf-default-deny-all
  namespace: ctf-instances
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
