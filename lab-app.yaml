# ArgoCD Application for the lab sandbox namespace (app spec 114): namespace,
# hardened default SA, quota/limits, the deny-all NetworkPolicy, the backend's
# scoped RBAC, and the ValidatingAdmissionPolicy requiring gVisor.
#
# The lab pods themselves are created by the app at runtime, exactly as
# ctf-instances works — nothing here schedules a pod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ctf-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Anders-Sec/ctf-gitops.git
    targetRevision: main
    path: lab
  destination:
    server: https://kubernetes.default.svc
    namespace: ctf-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
